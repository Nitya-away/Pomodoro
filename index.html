<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CozySpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&family=VT323&display=swap" rel="stylesheet">
    <link rel="Stylesheet" href="style.css">
</head>
<body class="cozy-night">

    <div class="particles">
    </div>

    <img id="pixelcat" class="pixel-cat" src="assets/imgs/catblink.gif" alt="CozySpace Cat">

    <div class="toast" id="toast" aria-live="polite"></div>

    <section class="landing-page page" id="landingPage">
        <nav>
            <h2>CozySpace</h2>
            <div class="nav-links">
                <div class="nav-item">
                    <span onclick="enterRoom('')">Focus</span>
                    <div class="tooltip-box">
                        <img src="assets/imgs/focus.png" alt="focus">
                        <p>Start a cozy Pomodoro Session While You Study/Work.</p>
                    </div>
                </div>
                <div class="nav-item">
                    <span onclick="enterRoom('')">Music</span>
                    <div class="tooltip-box">
                        <img src="assets/imgs/music.webp" alt="Music">
                        <p>Choose 4 Type Of Music With The Vibe.</p>
                    </div>
                </div>
                <div class="nav-item">
                    <span onclick="enterRoom('')">Notes</span>
                    <div class="tooltip-box">
                        <img src="assets/imgs/notes.png" alt="Notes">
                        <p>Write Every Important Detail You Want To Remember During Your Session.</p>
                    </div>
                </div>
            </div>
        </nav>
        
    </section>
</body>

</html>
